# 全项目默认配置；load_config() 会与本文件合并，未列出的项用 dataclass 默认值。
camera:
  width: 640
  height: 480
  fps: 30
  buffer_count: 3          # Picamera2 双实例，>=3 降低丢帧
  backend: auto            # auto | picamera2 | synthetic | replay
  left_index: 0
  right_index: 1

sync:
  enabled: true
  kp: 0.05                 # 相位误差 -> 周期修正；从 0.05 起
  target_offset_ns: 0
  max_step_us: 300
  min_frame_us: 30000
  max_frame_us: 40000

stream:
  transport: zmq           # zmq | none
  endpoint: tcp://0.0.0.0:5555
  jpeg_quality: 90
  raw_max_pairs: 0
  h264_bitrate_kbps: 2500

calib:
  pattern_cols: 9          # 内角点
  pattern_rows: 6
  square_mm: 30.0          # 实测值，不要用标称值
  min_views: 10
  clahe: false
  calib_path: data/calib/stereo_calib.npz

sgbm:
  min_disparity: 0
  num_disparities: 128     # 必须能被 16 整除
  block_size: 5
  p1: 0                    # 0 = 8*bs^2
  p2: 0                    # 0 = 32*bs^2
  uniqueness_ratio: 10
  speckle_window_size: 150
  speckle_range: 2
  disp12_max_diff: 1
  mode: sgbm_3way
  lr_max_diff: 1.0         # 左右一致性阈值（像素）
  texture_threshold: 6.0   # 5x5 局部标准差阈值
  min_valid_ratio: 0.05
  subpixel: true
  learned_backend: none    # none | onnx | tensorrt（阶段三）
  learned_model: ""

detect:
  backend: auto            # auto | yolo | color | none
  model_path: models/yolov8n.engine
  conf: 0.25
  imgsz: 640
  classes: null
  device: "0"

objects:
  bbox_shrink: 0.15
  min_valid_ratio: 0.20
  min_pixels: 200
  ground_classes: object,box,cup,bottle,chair
  ground_band: 0.45
  ransac_iters: 300
  ransac_thresh_m: 0.02
  min_ground_points: 800
  snap_bottom: true

proof:
  enabled: false
  target_depths_m: "0.65,1.00,1.50"

scene: {}
